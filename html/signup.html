<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Netflix - Sign Up</title>

    <link
        rel="stylesheet"
        href="../CSS/signup.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>


<body>


    <!-- HEADER -->

    <header>

        <img
            src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg"
            class="logo"
            alt="Netflix">

    </header>



    <!-- BACKGROUND -->

    <div class="background">

        <div class="overlay">


            <!-- SIGNUP BOX -->

            <div class="signup-box">

                <h1>Create Account</h1>


                <form id="signupForm">


                    <!-- FULL NAME -->

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Full Name"
                        required>


                    <!-- EMAIL -->

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        required>


                    <!-- PASSWORD -->

                    <input
                        type="password"
                        id="password"
                        placeholder="Create Password"
                        required>


                    <!-- CONFIRM PASSWORD -->

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                        required>


                    <!-- CREATE ACCOUNT -->

                    <button
                        type="submit">

                        Create Account

                    </button>


                    <!-- MESSAGE -->

                    <p
                        id="signupMessage"
                        class="signup-message">
                    </p>


                    <!-- LOGIN -->

                    <p>

                        Already have an account?

                        <a href="login.html">
                            Sign In
                        </a>

                    </p>


                </form>


            </div>


        </div>

    </div>



    <!-- JAVASCRIPT -->

    <script
        src="../Javascript/signup.js">
    </script>


</body>

</html>
